<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <title>One in Three: phone</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080b'/%3E%3Ccircle cx='8' cy='16' r='3' fill='%23e9e4da'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e9e4da' fill-opacity='.28'/%3E%3Ccircle cx='24' cy='16' r='3' fill='%23e9e4da' fill-opacity='.28'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/phone/phone.css" />
  </head>
  <body>
    <main class="ph">
      <span class="ph-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1 class="ph-title">Walk with your phone</h1>

      <p id="state" class="ph-state" data-state="idle" role="status" aria-live="polite">Not connected</p>
      <p id="message" class="ph-message" role="alert" hidden></p>

      <div id="steps-wrap" class="ph-steps" hidden>
        <span id="steps" class="ph-steps-n">0</span>
        <span class="ph-steps-l">steps</span>
        <span id="readout" class="ph-readout"></span>
      </div>

      <form id="form" class="ph-form" autocomplete="off">
        <label class="ph-label" for="code">Code from the game</label>
        <input
          id="code"
          class="ph-code"
          type="text"
          inputmode="text"
          maxlength="6"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          placeholder="ABC234"
        />
        <button id="start" class="ph-btn" type="submit">Start</button>
      </form>

      <p id="hint" class="ph-hint">Put the phone in a front pocket, then step in place.</p>
    </main>
    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
