<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>UI harness · One in Three</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #07080b;
      }
      /* Stand-in for the 3D view: a dark street with a few light sources, so
         HUD legibility can be judged over both shadow and glare. */
      #scene {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 22% 30% at 78% 46%, rgba(255, 214, 150, 0.55), rgba(255, 190, 110, 0.12) 60%, transparent 75%),
          radial-gradient(ellipse 10% 14% at 22% 30%, rgba(255, 176, 96, 0.5), transparent 70%),
          radial-gradient(ellipse 8% 10% at 48% 36%, rgba(180, 200, 255, 0.22), transparent 70%),
          linear-gradient(180deg, #0a0d16 0%, #10131c 44%, #1a1a1e 46%, #101114 64%, #08090b 100%);
      }
      #scene[data-bg='bright'] {
        background:
          radial-gradient(ellipse 60% 70% at 50% 60%, #fff3d6, #e9c98c 55%, #6f5a3a 100%);
      }
      #scene[data-bg='black'] {
        background: #000;
      }
      #harness {
        position: fixed;
        z-index: 40;
        font: 12px/1.4 ui-monospace, 'SF Mono', Menlo, monospace;
        color: #d8d4cb;
      }
      #harness[hidden] {
        display: none;
      }
      #harness .panel {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 250px;
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(12, 14, 19, 0.92);
      }
      #harness h2 {
        margin: 10px 0 4px;
        font: inherit;
        color: #8f897e;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #harness h2:first-child {
        margin-top: 0;
      }
      #harness button {
        margin: 2px 2px 2px 0;
        padding: 3px 7px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 3px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #harness button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      #harness input[type='range'] {
        width: 100%;
      }
      #harness .log {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: 46vw;
        padding: 6px 9px;
        border-radius: 4px;
        background: rgba(12, 14, 19, 0.85);
        white-space: pre-wrap;
        pointer-events: none;
      }
      #harness .log:empty {
        display: none;
      }
      .index {
        position: relative;
        z-index: 50;
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 24px 80px;
        color: #e9e4da;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .index h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 600;
      }
      .index p {
        margin: 0 0 22px;
        color: #a39e93;
      }
      .index table {
        width: 100%;
        border-collapse: collapse;
      }
      .index td,
      .index th {
        padding: 7px 12px 7px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        text-align: left;
        font-weight: 400;
      }
      .index th {
        color: #a39e93;
      }
      .index a {
        color: #d1a25c;
      }
      .index code {
        color: #b8b2a6;
      }
    </style>
  </head>
  <body>
    <div id="scene" role="img" aria-label="Placeholder for the simulation view"></div>
    <div id="hud"></div>
    <div id="screens"></div>
    <div id="harness" hidden></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
