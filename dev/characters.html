<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Characters harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #030405;
        color: #cfc9bd;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 1200 / 780));
        margin: 0 auto;
      }
      #view {
        display: block;
        width: 100%;
        height: auto;
      }
      #labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .label {
        position: absolute;
        padding: 6px 8px;
        box-sizing: border-box;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: #e9e4da;
        text-shadow: 0 1px 2px #000;
      }
      #stats {
        position: absolute;
        right: 8px;
        bottom: 6px;
        opacity: 0.7;
      }
      #panel {
        position: fixed;
        left: 8px;
        top: 8px;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 8px;
        padding: 8px 10px;
        background: rgba(10, 12, 16, 0.82);
        border: 1px solid #262a33;
        border-radius: 6px;
      }
      #panel select,
      #panel input,
      #panel button {
        font: inherit;
        color: inherit;
        background: #14171d;
        border: 1px solid #2c313b;
        border-radius: 4px;
        padding: 2px 4px;
      }
      #panel button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="labels"></div>
      <div id="stats"></div>
    </div>
    <div id="panel">
      <label for="p-build">build</label><select id="p-build"></select>
      <label for="p-emotion">emotion</label><select id="p-emotion"></select>
      <label for="p-intensity">intensity</label><input id="p-intensity" type="range" min="0" max="1" step="0.05" value="1" />
      <label for="p-posture">posture</label><select id="p-posture"></select>
      <label for="p-gesture">gesture</label><select id="p-gesture"></select>
      <label for="p-speed">walk m/s</label><input id="p-speed" type="range" min="0" max="3" step="0.1" value="0" />
      <label for="p-talk">talking</label><select id="p-talk"></select>
      <label for="p-dist">distance</label><input id="p-dist" type="range" min="0.5" max="6" step="0.1" value="1.3" />
      <label for="p-zoom">framing</label><select id="p-zoom"></select>
      <label for="p-hair">hair</label><select id="p-hair"></select>
      <label for="p-top">top</label><select id="p-top"></select>
      <label for="p-acc">accessory</label><select id="p-acc"></select>
      <button id="p-replay" type="button">replay gesture</button><button id="p-sheet" type="button">contact sheet</button>
    </div>
    <script type="module" src="/src/characters/devHarness.ts"></script>
  </body>
</html>
