<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movement harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07080b;
        color: #cfd3da;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel,
      #readout {
        position: fixed;
        left: 8px;
        padding: 8px 10px;
        background: rgba(4, 6, 9, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
      }
      #panel {
        top: 8px;
      }
      #readout {
        bottom: 8px;
      }
      #map {
        position: fixed;
        right: 8px;
        top: 8px;
        width: 250px;
        height: 340px;
        background: rgba(4, 6, 9, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        pointer-events: none;
      }
      #cross {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        pointer-events: none;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="cross"></div>
    <div id="panel"></div>
    <div id="readout"></div>
    <canvas id="map" width="500" height="680"></canvas>
    <script type="module" src="./movement.ts"></script>
  </body>
</html>
